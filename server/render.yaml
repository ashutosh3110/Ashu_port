services:
  - type: web
    name: portfolio-backend-api
    env: node
    region: singapore
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: CLIENT_URL
        value: https://ashu-port-drab.vercel.app
      - key: JWT_SECRET
        generateValue: true

